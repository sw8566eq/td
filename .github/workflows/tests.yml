name: Tests

on:
  push:
    branches: [main, overhaul/roguelike-deckbuilder]
  pull_request:
    branches: [main, overhaul/roguelike-deckbuilder]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Game() and a couple of AssetManager tests open a real pygame
      # window and initialize the audio mixer; the SDL "dummy" drivers let
      # that happen with no real display or sound device. tests/conftest.py
      # (for every Game-level module) and tests/test_assets.py/
      # tests/test_audio.py already set these themselves before pygame is
      # touched, so they're set here mainly for clarity/robustness rather
      # than because CI would fail without them.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: pytest -v
