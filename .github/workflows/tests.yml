name: Tests

on:
  push:
    branches: [main, overhaul/roguelike-deckbuilder]
  pull_request:
    branches: [main, overhaul/roguelike-deckbuilder]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Game() and a couple of AssetManager tests open a real pygame
      # window and initialize the audio mixer; the SDL "dummy" drivers let
      # that happen with no real display or sound device. tests/conftest.py
      # (for every Game-level module) and tests/test_assets.py/
      # tests/test_audio.py already set these themselves before pygame is
      # touched, so they're set here mainly for clarity/robustness rather
      # than because CI would fail without them.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: ruff check .

      # Scoped to the modules actually annotated so far (see pyproject.toml's
      # [[tool.mypy.overrides]] and CLAUDE.md's "Ongoing: incremental mypy
      # adoption") -- most of the codebase has no type hints yet, so `mypy .`
      # would fail on files nobody's annotated, not on a real regression.
      - run: mypy relics.py run_map.py events.py shop.py rng_sampling.py difficulty.py economy.py run_history.py json_io.py

      # 98%, not the measured 98.68% -- leaves ~38 statements of headroom so
      # ordinary future work doesn't flake CI, while still catching a real
      # regression given this codebase's own near-100%-everywhere testing
      # culture. 99% was tried first and already fails today with zero
      # slack, confirming it's not a viable floor.
      - run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=98
