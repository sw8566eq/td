name: Tests

on:
  push:
    branches: [main, overhaul/roguelike-deckbuilder]
  pull_request:
    branches: [main, overhaul/roguelike-deckbuilder]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Game() and a couple of AssetManager tests open a real pygame
      # window; the SDL "dummy" driver lets that happen with no real
      # display. tests/conftest.py (for every Game-level module) and
      # tests/test_assets.py already set this themselves before pygame is
      # touched, so it's set here mainly for clarity/robustness rather than
      # because CI would fail without it.
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: pytest -v
