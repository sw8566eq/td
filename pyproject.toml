[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# Every Tower subclass carries class-level dict registries (EXTRA_STATS,
# SPECIALIZATIONS, LEVEL_STAT_MULTIPLIER_OVERRIDES, ...) as read-only content
# tables -- see CLAUDE.md's "Content is registries, not conditionals" -- never
# mutated at runtime, so the generic mutable-class-default warning doesn't
# apply to this file's own deliberate pattern.
"tower.py" = ["RUF012"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# Deliberately permissive project-wide -- most of this codebase (pygame-
# facing code especially) has no type hints yet, and this isn't a
# repo-wide requirement from day one (see CLAUDE.md's "Ongoing:
# incremental mypy adoption"). Individual modules opt into strict
# checking below as they're annotated, one at a time, rather than
# annotating the whole codebase in one pass.
check_untyped_defs = false
disallow_untyped_defs = false
# An annotated module can still import an unannotated one (relics.py ->
# meta_progression.py, card_pool.py -> tower.py, ...) -- "silent" uses
# that module's own inferred types for whatever it exports without also
# re-reporting *its* pre-existing errors just because something we did
# choose to check happens to import it. Without this, checking one small
# annotated module could fail CI over an unrelated error in a completely
# unannotated one several imports away.
follow_imports = "silent"

[[tool.mypy.overrides]]
# The first modules annotated -- small, pygame-free, and already the most
# heavily-commented "content is data" modules in the codebase, so typing
# their registries/functions is mostly transcribing what the docstrings
# already say. CI runs `mypy` against exactly this file list (see
# .github/workflows/tests.yml), not the whole repo, so this list and that
# command must be extended together as more modules are annotated.
#
# rng_sampling/difficulty/economy/run_history/json_io were added in a
# second pass -- each pygame-free and either trivially annotatable
# (difficulty.py's registries, economy.py's plain int/bool methods) or
# already fully typed and just missing from this list (rng_sampling.py).
# json_io.py had to join this list as a prerequisite, not a standalone
# addition: annotating run_history.py's load_run_history() to return
# dict[int, int] surfaced a fresh no-any-return error the moment its body
# (`return load_json_with_fallback(...)`) called into json_io.py while
# json_io.py itself stayed unannotated -- follow_imports = "silent" only
# suppresses re-reporting an unannotated callee's *own* errors, it doesn't
# stop warn_return_any from firing when a strict function's return value
# is directly the result of an untyped call. This is the exact same
# "would this call silently launder into Any" problem rng_sampling.
# sample_up_to was already solving for relics.py/run_map.py/events.py/
# shop.py -- json_io.load_json_with_fallback needed the identical PEP 695
# generic treatment for the same reason.
# A third pass added threshold_unlocks/meta_progression/run_state/
# card_pool -- this one edited already-strict files too, not just added
# new ones: annotating meta_progression.unlocked_relic_pool() surfaced an
# over-widened parameter in the already-strict relics._default_relic_pool
# (typed `str | None` even though relic_offer() always coalesces None away
# before calling it -- fixed to plain `str`; card_pool._default_unlocked_
# pool had the identical shape and got the same fix). run_state.py also
# had a genuine "type lied" bug, same class as v0.3.0's RelicModifiers
# catch: `current_node_id: str = None` was a required field silently
# defaulting to None -- fixed to `str | None = None`, with `assert
# self.current_node_id is not None` added to current_level_id/current_row
# to narrow it back down before indexing into the map (game.py:744 already
# treated it as Optional, so this was never hypothetical). Once run_state.py
# itself was annotated, relics.py/shop.py/events.py's own `if TYPE_CHECKING:
# from run_state import RunState` guards became unnecessary -- no import
# cycle exists, so all three now import RunState for real.
# A fourth pass added run_escalation/progress/achievements -- all three
# pygame-free and needing only bare-function annotations, no dataclass
# fixes: run_escalation.py already had a typed FloorEscalation dataclass,
# its four bare functions just needed int/FloorEscalation signatures;
# progress.py mirrors run_history.py's already-solved dict[int, int]-via-
# load_json_with_fallback shape exactly, so it needed no fresh json_io-
# style prerequisite; achievements.py mirrors meta_progression.py's own
# Achievement/load_*/bump()/set_counter() shapes verbatim (both already
# share threshold_unlocks.py's mechanics). achievements.py's one
# unannotated import, levels.LEVELS (used only via len(levels.LEVELS) for
# campaign_complete's own goal), needed no attention: len() always
# resolves to a concrete int regardless of its argument's own inferred
# type, unlike run_history.py's old problem where an untyped call's
# return value was forwarded directly.
module = [
    "relics", "run_map", "events", "shop", "rng_sampling", "difficulty", "economy", "run_history", "json_io",
    "threshold_unlocks", "meta_progression", "run_state", "card_pool", "run_escalation", "progress",
    "achievements",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
